openapi: '3.1.0'
info:
  title: User API
  version: 0.0.0 # Gets replaced by the version in package.json in swagger.ts

security:
  - ApiKeyAuth: []

tags:
  - name: User
    description: User management
  - name: Config
  - name: Statistics

paths:
  /api/user/new:
    post:
      summary: Create a new user
      tags: [User]
      security: []
      parameters:
        - in: query
          name: username
          schema:
            type: string
            description: The username of the user
        - in: query
          name: email
          schema:
            type: string
            description: The email of the user
      responses:
        200:
          description: The created user
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      token:
                        type: string
                        description: The user's token
                  - $ref: '#/components/schemas/User'
          links:
            UserId:
              description: >
                The id of the user. This id should be used when making requests to the user's endpoints. It identifies the user.
              operationRef: '#/paths/~1api~1user~1{id}/get'
              parameters:
                id: $request.path.id
            Token:
              description: >
                The token of the user. This token should be stored and included in the `authorization` header for future requests.
              parameters:
                authorization: $request.header.authorization

        400:
          $ref: '#/components/responses/BadRequest'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalServerError'

  /api/user/recovery-code:
    post:
      summary: Create or replace the account recovery code
      description: >
        Returns the plaintext code once. Regenerating a code invalidates the
        previously issued one.
      tags: [User]
      responses:
        200:
          description: The generated recovery code
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: The recovery code to store somewhere safe
                required:
                  - code
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
        500:
          $ref: '#/components/responses/InternalServerError'

  /api/auth/recover:
    post:
      summary: Recover an account with its recovery code
      tags: [User]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: The recovery code shown when it was generated
              required:
                - code
      responses:
        200:
          description: A new token for the recovered account
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      token:
                        type: string
                        description: A newly signed token for the recovered user
                  - $ref: '#/components/schemas/User'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalServerError'

  /api/user/{id}:
    get:
      summary: Get a user by id
      tags: [User]
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        200:
          description: The created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
        500:
          $ref: '#/components/responses/InternalServerError'

  /api/user/:
    get:
      summary: Get user
      tags: [User]
      security:
        - ApiKeyAuth: []
      responses:
        200:
          description: The created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
        500:
          $ref: '#/components/responses/InternalServerError'
    put:
      summary: Update user
      tags: [User]
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: username
          required: false
          schema:
            type: string
            description: The username of the user
        - in: query
          name: email
          required: false
          schema:
            type: string
            description: The email of the user
      responses:
        200:
          description: The created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
        500:
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete user
      tags: [User]
      security:
        - ApiKeyAuth: []
      responses:
        200:
          description: The delted user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
        500:
          $ref: '#/components/responses/InternalServerError'

  /api/user/count/increment:
    post:
      summary: Increment the count of a user
      tags: [User]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spawnToken]
              properties:
                spawnToken:
                  type: string
                  description: >
                    One-time spawn token issued by /api/configuration/spawn-token.
                    The balloon type is taken from the token, so the former `type`
                    query parameter is no longer used.
      responses:
        200:
          description: The updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The user's id
                  count:
                    type: integer
                    description: The user's count
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalServerError'

  /api/status:
    get:
      summary: Get the status of the server
      tags: [Config]
      responses:
        200:
          description: The status of the server
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: The status of the server
                    enum:
                      - 'up'
                  version:
                    type: string
                    description: The version of the server
                    example: '1.0.0'
        500:
          $ref: '#/components/responses/InternalServerError'

  /api/configuration/spawn-token:
    get:
      summary: Get this user's active balloon spawn schedule
      description: >-
        Returns the user's active spawn schedule. While a schedule is active,
        repeated calls return the same token and spawn time (idempotent), so
        polling cannot yield extra balloons. A new schedule is created only
        after the current token is consumed or expires.
      tags: [Config]
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: spawn-rate
          required: false
          description: >-
            The user's spawn-rate slider (0.1-1). Values outside the range are
            clamped, so this can only slow spawning down. Applies to the next
            schedule if one is already active.
          schema:
            type: number
            minimum: 0.1
            maximum: 1
            default: 1
      responses:
        200:
          description: The spawn token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpawnToken'
        401:
          $ref: '#/components/responses/Unauthorized'
        500:
          $ref: '#/components/responses/InternalServerError'

  /api/configuration:
    get:
      summary: Get the configuration
      tags: [Config]
      security:
        - ApiKeyAuth: []
      responses:
        200:
          description: The configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
        401:
          $ref: '#/components/responses/Unauthorized'
        500:
          $ref: '#/components/responses/InternalServerError'

  /api/leaderboard:
    get:
      summary: Get the leaderboard
      tags: [Statistics]
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
            description: The number of users to return
        - in: query
          name: skip
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
            description: The number of users to skip
        - in: query
          name: start-date
          required: false
          schema:
            type: string
            format: iso-date
            description: The start date of the leaderboard
        - in: query
          name: end-date
          required: false
          schema:
            type: string
            format: iso-date
            description: The end date of the leaderboard
      responses:
        200:
          description: The leaderboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    description: The user making the request
                    $ref: '#/components/schemas/User'
                  rank:
                    type: integer
                    description: The position on the leaderboard of the user making the request
                    nullable: true
                  topUsers:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                required:
                  - 'topUsers'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        500:
          $ref: '#/components/responses/InternalServerError'
  /api/statistics:
    get:
      summary: Get the statistics
      tags: [Statistics]
      security:
        - ApiKeyAuth: []
      responses:
        200:
          description: The statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalPopped:
                    type: integer
                    description: The total number of balloons popped
                required:
                  - 'totalPopped'

        401:
          $ref: '#/components/responses/Unauthorized'
        500:
          $ref: '#/components/responses/InternalServerError'
  /api/statistics/history:
    get:
      description: Get the pop history of the user
      tags: [Statistics]
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: start-date
          required: true
          schema:
            type: string
            format: date-time
            description: The start date of the history
            default: '2024-07-01T00:00:00.000Z'
        - in: query
          name: end-date
          required: false
          schema:
            type: string
            format: date-time
            description: The end date of the history
        - in: query
          name: id
          required: false
          schema:
            type: string
            description: Id of your user to only get your history
      responses:
        200:
          description: The pop history between the start and end date
          content:
            application/json:
              schema:
                type: object
                properties:
                  history:
                    type: array
                    items:
                      $ref: '#/components/schemas/HistoryNode'
  /api/statistics/scores:
    get:
      summary: Get the amount of popped balloons per type
      tags: [Statistics]
      security:
        - ApiKeyAuth: []
      responses:
        200:
          description: The amount of popped balloons per type
          content:
            application/json:
              schema:
                type: object
                properties:
                  scores:
                    type: object
                    description: The amount of popped balloons per type
                    additionalProperties:
                      type: integer
                      description: The score of the user
        401:
          $ref: '#/components/responses/Unauthorized'
        500:
          $ref: '#/components/responses/InternalServerError'

components:
  parameters:
    id:
      name: id
      in: path
      required: true
      description: 'The id of the user'
      schema:
        type: string
  responses:
    BadRequest: # 400
      description: 'Bad request'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'Bad request'
    Unauthorized: # 401
      description: 'Unauthorized'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'Invalid token'
    Forbidden: # 403
      description: 'Forbidden'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'Forbidden'
    NotFound: # 404
      description: 'Not found'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'User not found'
    TooManyRequests: # 429
      description: 'Too many requests'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'Too many requests'
    InternalServerError: # 500
      description: 'Internal server error'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'Internal server error'

  schemas:
    Config:
      type: object
      properties:
        spawnInterval:
          type: object
          description: The interval in milliseconds to spawn a balloon
          properties:
            min:
              type: integer
              description: The minimum interval
              minimum: 0
            max:
              type: integer
              description: The maximum interval
              minimum: 0
          required:
            - min
            - max
        badge:
          type: object
          description: The badge configuration
          properties:
            color:
              type: string
              description: The color of the badge
              example: '#26282b'
            backgroundColor:
              type: string
              description: The background color of the badge
              example: '#7aa5eb'
          required:
            - color
            - backgroundColor
      required:
        - 'spawnInterval'
        - 'badge'
    SpawnToken:
      type: object
      properties:
        serverTime:
          type: number
          description: >-
            Server clock at response time (Unix ms). Clients should subtract
            (serverTime - local receive time) from spawnAt and expiresAt before
            scheduling local alarms, to correct for clock skew.
        spawnToken:
          type: string
          description: The one-time JWT spawn token
        balloonType:
          type: string
          description: The balloon type the backend chose
        spawnAt:
          type: number
          description: Unix timestamp when the balloon should spawn
        expiresAt:
          type: number
          description: Unix timestamp when the token expires (spawnAt + 30s)
    User:
      properties:
        id:
          type: string
          description: The user's id
        username:
          type: string
          description: The user's username
        email:
          type: string
          description: The user's email (will only be returned if the user is the same as the one making the request)
        hasRecoveryCode:
          type: boolean
          description: Whether a recovery code is set (only returned to the account owner)
        count:
          type: integer
          description: The user's count
        updatedAt:
          type: string
          format: date-time
          description: The date the user was last updated
        createdAt:
          type: string
          format: date-time
          description: The date the user was created
      required:
        - id
        - username
        - count
        - updatedAt
        - createdAt
    HistoryNode:
      properties:
        date:
          type: string
          format: date-time
          description: The date the balloon was popped
        pops:
          type: object
          properties:
            # key is the name of the balloon, value is the number of pops
            [key: string]:
              type: integer
              description: The number of pops of this balloon type
              minimum: 0
      required:
        - date
        - pops
    Error:
      properties:
        error:
          type: string
          description: The error message
      required:
        - 'error'

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: authorization
